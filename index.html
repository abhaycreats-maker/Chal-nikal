<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Don't Click 😈</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}

h1 {
  margin-bottom: 20px;
}

button {
  position: absolute;
  padding: 20px 40px;
  font-size: 22px;
  background: red;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

/* VIDEO */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 10;
}

/* FLASH */
.flash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  z-index: 20;
}

/* POPUP TEXT */
.popup {
  position: absolute;
  color: red;
  font-size: 30px;
  font-weight: bold;
  animation: pop 0.5s linear;
}

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1.5); opacity: 1; }
}

/* SHAKE */
.shake {
  animation: shake 0.2s infinite;
}

@keyframes shake {
  0% { transform: translate(5px, 5px); }
  25% { transform: translate(-5px, 5px); }
  50% { transform: translate(5px, -5px); }
  75% { transform: translate(-5px, -5px); }
  100% { transform: translate(5px, 5px); }
}
</style>
</head>

<body>

<h1>⚠️ DON'T CLICK THIS BUTTON ⚠️</h1>

<button id="btn" onclick="startMeme()">DON'T CLICK 😈</button>

<div class="flash" id="flash"></div>

<video id="video">
  <source src="video.mp4" type="video/mp4">
</video>

<audio id="sound">
  <source src="sound.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("btn");

// BUTTON BHAGEGA 😈
btn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 150);
  const y = Math.random() * (window.innerHeight - 80);
  btn.style.left = x + "px";
  btn.style.top = y + "px";
});

function startMeme() {
  const video = document.getElementById("video");
  const flash = document.getElementById("flash");
  const sound = document.getElementById("sound");

  // SOUND BLAST 🔊
  sound.volume = 1;
  sound.play();

  // FLASH ⚡
  flash.style.opacity = "1";
  setTimeout(() => flash.style.opacity = "0", 100);

  // SHAKE 😵
  document.body.classList.add("shake");

  // VIDEO 🎥
  video.style.display = "block";
  video.play();

  // FULLSCREEN
  if (video.requestFullscreen) {
    video.requestFullscreen();
  }

  // RANDOM POPUPS 😈
  const texts = ["😂 GOT YOU!", "DON'T CLICK BOLA THA!", "AB DEKH 😈", "SYSTEM HACKED!", "LOL 😂"];

  setInterval(() => {
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.innerText = texts[Math.floor(Math.random() * texts.length)];

    popup.style.left = Math.random() * window.innerWidth + "px";
    popup.style.top = Math.random() * window.innerHeight + "px";

    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 500);
  }, 200);

  // VIBRATION 📱
  if (navigator.vibrate) {
    navigator.vibrate([500, 200, 500, 200, 800]);
  }
}
</script>

</body>
</html>
